app = "mvu-esc-voting"
primary_region = "fra"

[env]
  PORT = "3000"
  DATA_FILE = "/data/data.json"

# State lives in memory and in one JSON file: run exactly one machine.
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
