app = "mvu-esc-voting"
primary_region = "fra"

[env]
  PORT = "3000"
  DATA_FILE = "/data/data.json"

# State lives in memory and in one JSON file: run exactly one machine.
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # ~500 phones polling every 4 s: count in-flight requests and keep the limits far above
  # what the hall can produce, so the proxy never queues or rejects voters.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 800
    hard_limit = 1000

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
