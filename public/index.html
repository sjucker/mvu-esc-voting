<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160b3a">
  <title>Winner-Song-Voting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Noto+Color+Emoji&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px 140px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 900; margin-top: 6px; }
    header .logo { max-width: 340px; margin-bottom: 14px; }

    .songs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .song {
      display: flex; align-items: center; justify-content: flex-start; gap: 14px;
      width: 100%; text-align: left;
      padding: 16px; border-radius: var(--radius);
      background: var(--surface); border: 2px solid var(--border);
      font-weight: 500;
    }
    .song .num {
      flex: none; width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--surface-2); font-weight: 800;
    }
    .song .t { font-weight: 800; font-size: 1.05rem; display: block; }
    .song .a { color: var(--muted); font-size: .9rem; }
    .song[aria-checked="true"] {
      border-color: var(--pink);
      background: linear-gradient(100deg, rgba(255,46,147,.28), rgba(138,60,255,.22));
      box-shadow: 0 0 0 4px rgba(255,46,147,.18), 0 10px 30px rgba(255,46,147,.25);
    }
    .song[aria-checked="true"] .num { background: var(--grad); }

    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(11,6,32,.95) 30%);
    }
    .bar button { width: 100%; max-width: 560px; margin: 0 auto; display: flex; padding: 18px; font-size: 1.1rem; }

    .message { text-align: center; padding: 36px 22px; }
    .message .big { font-size: 3.5rem; line-height: 1; margin-bottom: 14px; }
    .message h2 { font-size: 1.6rem; font-weight: 900; }
    .chosen { margin: 18px 0 6px; font-size: 1.3rem; font-weight: 800; }
    .change { margin-top: 20px; background: var(--surface-2); border: 1px solid var(--border); }
    .cancel { display: block; margin: 18px auto 0; background: none; color: var(--muted); text-decoration: underline; }
    .pop { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="/logo.png" alt="Best of Eurovision Song Contest" width="800" height="464">
      <div class="eyebrow">Musikverein Harmonie Urdorf</div>
      <h1 class="grad-text">Winner-Song-Voting</h1>
      <div class="muted" id="event-title"></div>
    </header>
    <div id="view" aria-live="polite"><p class="muted" style="text-align:center">Lade…</p></div>
  </main>
  <div class="bar" id="bar" hidden>
    <button class="btn-primary" id="submit" disabled>Song auswählen</button>
  </div>
  <div class="toast" id="toast" role="alert" hidden></div>

  <script src="/common.js"></script>
  <script>
    const VOTED_KEY = 'mvu-esc-voted';
    const view = document.getElementById('view');
    const bar = document.getElementById('bar');
    const submit = document.getElementById('submit');
    let state = null;
    let selected = null;
    let renderedKey = '';
    let submitting = false;
    let changing = false; // voter is picking a different song

    function localVote() {
      try { return JSON.parse(localStorage.getItem(VOTED_KEY)); } catch { return null; }
    }
    function rememberVote(songId) {
      try { localStorage.setItem(VOTED_KEY, JSON.stringify({ songId, round: state.round })); } catch {}
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.hidden = false;
      clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 4000);
    }

    function message(icon, title, text, extra = '', after = '') {
      return `<div class="card message pop"><div class="big">${icon}</div><h2>${title}</h2>${extra}<p class="muted">${text}</p>${after}</div>`;
    }

    function votedSong() {
      // The server is the source of truth; localStorage only covers browsers that drop cookies.
      if (state.myVote) return state.songs.find((s) => s.id === state.myVote);
      const local = localVote();
      if (local && local.round === state.round) return state.songs.find((s) => s.id === local.songId) || null;
      return null;
    }

    function render() {
      document.getElementById('event-title').textContent = state.title;
      const mine = votedSong();
      // Changing needs the server to know this browser (cookie); with only the
      // localStorage fallback a second vote would be counted in addition.
      const canChange = Boolean(mine && state.myVote && state.votingOpen);
      if (!canChange) changing = false;
      let mode;
      if (state.revealed) mode = 'revealed';
      else if (mine && !changing) mode = 'voted';
      else if (!state.songs.length || !state.votingOpen) mode = state.totalVotes > 0 ? 'closed' : 'waiting';
      else mode = 'open';

      const key = mode + '|' + canChange + '|' + (mine?.id || '') + '|' + state.songs.map((s) => s.id + s.title + s.artist + s.country).join();
      if (key === renderedKey) return;
      renderedKey = key;
      bar.hidden = mode !== 'open';

      if (mode === 'waiting') {
        view.innerHTML = message('🎺', 'Gleich geht’s los!',
          'Das Voting ist noch nicht geöffnet. Diese Seite aktualisiert sich automatisch – einfach offen lassen.');
      } else if (mode === 'closed') {
        view.innerHTML = message('⏳', 'Das Voting ist geschlossen',
          'Die Stimmen werden ausgezählt. Die Auflösung gibt’s gleich auf der Leinwand!');
      } else if (mode === 'voted') {
        view.innerHTML = message('🎉', 'Danke für deine Stimme!',
          'Die Auflösung gibt’s am Ende auf der Leinwand. Viel Spass beim Konzert!',
          `<p class="muted" style="margin:14px 0 0">Du hast gestimmt für</p><div class="chosen grad-text">${esc(mine.title)}</div><div class="muted">${esc(songLine(mine))}</div>`,
          canChange ? '<button class="change" id="change">Stimme ändern</button>' : '');
      } else if (mode === 'revealed') {
        view.innerHTML = message('👀', 'Schau auf die Leinwand!',
          'Das Publikum hat entschieden – jetzt wird der Winner-Song enthüllt.');
      } else {
        if (selected && !state.songs.some((s) => s.id === selected)) selected = null;
        view.innerHTML = `
          <p style="text-align:center;margin:0 0 16px">Welcher Song ist dein <strong>Winner-Song</strong>? ${changing
            ? 'Du kannst deine Stimme ändern, solange das Voting offen ist.'
            : 'Du hast <strong>eine</strong> Stimme.'}</p>
          <ul class="songs" role="radiogroup" aria-label="Songs">
            ${state.songs.map((s, i) => `
              <li><button class="song" role="radio" aria-checked="${s.id === selected}" data-id="${esc(s.id)}">
                <span class="num">${i + 1}</span>
                <span><span class="t">${esc(s.title)}</span><span class="a">${esc(songLine(s))}</span></span>
              </button></li>`).join('')}
          </ul>
          ${changing ? '<button class="cancel" id="cancel">Abbrechen – Stimme behalten</button>' : ''}`;
        updateSubmit();
      }
    }

    function updateSubmit() {
      const song = state.songs.find((s) => s.id === selected);
      const unchanged = changing && selected === state.myVote;
      submit.disabled = !song || submitting || unchanged;
      if (!song) submit.textContent = 'Song auswählen';
      else if (unchanged) submit.textContent = 'Anderen Song auswählen';
      else submit.textContent = changing ? `Stimme zu «${song.title}» ändern` : `Für «${song.title}» abstimmen`;
    }

    view.addEventListener('click', (e) => {
      if (e.target.closest('#change, #cancel')) {
        changing = Boolean(e.target.closest('#change'));
        selected = changing ? state.myVote : null;
        render();
        if (changing) window.scrollTo(0, 0);
        return;
      }
      const btn = e.target.closest('.song');
      if (!btn) return;
      selected = btn.dataset.id;
      view.querySelectorAll('.song').forEach((b) => b.setAttribute('aria-checked', String(b === btn)));
      updateSubmit();
    });

    submit.addEventListener('click', async () => {
      if (!selected || submitting) return;
      submitting = true; updateSubmit();
      try {
        state = await api('/api/vote', { method: 'POST', body: { songId: selected } });
        rememberVote(selected);
        changing = false;
        selected = null;
      } catch (err) {
        toast(err.message);
        await refresh();
      } finally {
        submitting = false;
        renderedKey = '';
        render();
      }
    });

    async function refresh() {
      try {
        state = await api('/api/state');
        render();
      } catch {
        if (!state) view.innerHTML = message('📡', 'Keine Verbindung', 'Wir versuchen es gleich nochmals…');
      }
    }

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
