<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winner-Song-Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Noto+Color+Emoji&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { cursor: default; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .screen[hidden] { display: none; }

    /* ---------- idle: QR + live counter */
    #idle { gap: 3.5vh; padding: 4vh 5vw; text-align: center; }
    #idle .logo { width: auto; height: 22vh; margin-bottom: 2vh; }
    #idle h1 { font-size: clamp(2.2rem, 6vw, 7rem); font-weight: 900; margin: 0; }
    #idle .eyebrow { font-size: clamp(.8rem, 1.4vw, 1.4rem); }
    .idle-row { display: flex; align-items: center; justify-content: center; gap: 6vw; flex-wrap: wrap; }
    .qr { background: #fff; padding: 2vh; border-radius: 3vh; width: min(34vh, 40vw); box-shadow: 0 0 80px rgba(255,46,147,.35); }
    .qr svg { display: block; width: 100%; height: auto; }
    .url { font-size: clamp(1rem, 2.2vw, 2.2rem); font-weight: 800; margin-top: 1.5vh; }
    .count { font-size: clamp(5rem, 16vw, 18rem); font-weight: 900; line-height: .9; }
    .count.bump { animation: bump .5s cubic-bezier(.2, 1.8, .4, 1); }
    @keyframes bump { 40% { transform: scale(1.15); } }
    .count-label { font-size: clamp(1rem, 2.4vw, 2.4rem); font-weight: 700; color: var(--muted); }
    #idle .pill { font-size: clamp(.9rem, 1.6vw, 1.5rem); padding: .5em 1.2em; }

    /* ---------- intro captions */
    #intro { background: rgba(5, 2, 16, .92); z-index: 5; text-align: center; padding: 5vw; }
    #intro-text { font-size: clamp(2.2rem, 6.5vw, 7.5rem); font-weight: 900; max-width: 18ch; }
    .fade-in { animation: fadeUp 1s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4vh) scale(.96); filter: blur(8px); } }

    /* ---------- scoreboard */
    #board { justify-content: flex-start; padding: 4vh 5vw; gap: 2.2vh; }
    #board-caption { font-size: clamp(1.6rem, 4.2vh, 4rem); font-weight: 900; min-height: 1.3em; text-align: center; }
    .rows { width: 100%; max-width: 1500px; display: flex; flex-direction: column; gap: calc(var(--rowh) * .14); perspective: 1400px; }
    .row {
      height: var(--rowh);
      display: grid; grid-template-columns: calc(var(--rowh) * 1.1) minmax(0, 1.25fr) minmax(0, 1fr) calc(var(--rowh) * 1.9);
      align-items: center; gap: calc(var(--rowh) * .3);
      padding: 0 calc(var(--rowh) * .3);
      border-radius: calc(var(--rowh) * .22);
      background: var(--surface); border: 1px solid var(--border);
      font-size: calc(var(--rowh) * .36);
      transform-origin: center;
    }
    .row .rank { font-weight: 900; text-align: center; color: var(--muted); }
    .row .who { min-width: 0; }
    .row .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .a { font-size: .62em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meter { height: 38%; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .row .fill { height: 100%; width: 0; border-radius: inherit; background: var(--grad); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
    .row .score { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
    .row .score small { font-size: .5em; color: var(--muted); font-weight: 700; margin-left: .3em; }
    .row.hidden-song .t { color: rgba(255,255,255,.28); letter-spacing: .3em; }
    .row.hidden-song { animation: shimmer 2.4s ease-in-out infinite; }
    @keyframes shimmer { 50% { background: rgba(255,255,255,.1); } }
    .row.flip { animation: flip .8s cubic-bezier(.3, .7, .3, 1); }
    @keyframes flip { 0% { transform: rotateX(0); } 45% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
    .row.revealed { background: linear-gradient(100deg, rgba(255,46,147,.14), rgba(138,60,255,.12)); border-color: rgba(255,46,147,.35); }
    .row.revealed .rank { color: var(--text); }
    .row.suspense { animation: suspense .9s ease-in-out infinite; border-color: var(--gold); }
    @keyframes suspense { 50% { box-shadow: 0 0 40px rgba(255,211,92,.45); transform: scale(1.012); } }
    .row.champion { background: linear-gradient(100deg, rgba(255,211,92,.3), rgba(255,46,147,.25)); border-color: var(--gold); }
    .row.champion .rank { color: var(--gold); }

    /* ---------- winner */
    #winner { background: #030108; z-index: 10; text-align: center; padding: 4vh 5vw; overflow: hidden; }
    .beams { position: absolute; inset: -50%; opacity: 0; transition: opacity 1.5s; }
    .beams.on { opacity: 1; }
    .beam {
      position: absolute; left: 50%; bottom: 25%; width: 40vmax; height: 140vmax;
      transform-origin: 50% 100%;
      background: linear-gradient(to top, rgba(255,255,255,.28), rgba(255,255,255,0) 75%);
      clip-path: polygon(45% 100%, 55% 100%, 100% 0, 0 0);
      mix-blend-mode: screen; filter: blur(6px);
    }
    .beam.b1 { margin-left: -20vmax; animation: sweep1 5s ease-in-out infinite alternate; background: linear-gradient(to top, rgba(255,46,147,.4), transparent 75%); }
    .beam.b2 { margin-left: -20vmax; animation: sweep2 6s ease-in-out infinite alternate; background: linear-gradient(to top, rgba(25,211,255,.35), transparent 75%); }
    .beam.b3 { margin-left: -20vmax; animation: sweep3 4.5s ease-in-out infinite alternate; }
    @keyframes sweep1 { from { transform: rotate(-38deg); } to { transform: rotate(12deg); } }
    @keyframes sweep2 { from { transform: rotate(35deg); } to { transform: rotate(-15deg); } }
    @keyframes sweep3 { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    .spot {
      position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s;
      background: radial-gradient(ellipse 45% 38% at 50% 52%, rgba(255,255,255,.14), transparent 70%);
    }
    .spot.on { opacity: 1; }
    .winner-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 2.5vh; }
    #winner-pre { font-size: clamp(2rem, 6vw, 7rem); font-weight: 900; }
    #winner-card[hidden] { display: none; }
    #winner-card.static * { animation: none !important; }
    #winner-card { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
    .crown { font-size: clamp(3rem, 11vh, 9rem); line-height: 1; animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-1.5vh) rotate(-4deg); } }
    .winner-title {
      font-size: clamp(3rem, 10vw, 12rem); font-weight: 900; line-height: 1; max-width: 16ch;
      background: linear-gradient(100deg, var(--gold), #fff 40%, var(--pink) 70%, var(--gold));
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 30px rgba(255,211,92,.55));
      animation: slam 1.1s cubic-bezier(.15, 1.5, .35, 1) both, shine 4s linear 1.1s infinite;
    }
    .winner-title.small { font-size: clamp(2.2rem, 6vw, 7rem); }
    @keyframes slam { 0% { transform: scale(3); opacity: 0; filter: blur(20px); } 60% { opacity: 1; } }
    @keyframes shine { to { background-position: -250% 0; } }
    .winner-artist { font-size: clamp(1.3rem, 3.4vw, 3.6rem); font-weight: 700; color: #e8defc; animation: fadeUp 1s .7s both; }
    .winner-votes { font-size: clamp(1.1rem, 2.4vw, 2.6rem); font-weight: 800; animation: fadeUp 1s 1.3s both; }
    .winner-votes .pill { font-size: 1em; padding: .4em 1.1em; }
    .zugabe { font-size: clamp(2rem, 5vw, 6rem); font-weight: 900; letter-spacing: .08em; animation: fadeUp 1s 2s both, pulse 1.6s 3s infinite; }
    .shake { animation: shake .5s; }
    @keyframes shake { 20%, 60% { transform: translate(-1vw, .5vh); } 40%, 80% { transform: translate(1vw, -.5vh); } }
    .flash { position: fixed; inset: 0; background: #fff; z-index: 20; pointer-events: none; animation: flash .8s ease-out forwards; }
    @keyframes flash { from { opacity: .9; } to { opacity: 0; } }

    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

    /* ---------- operator controls */
    .controls { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 30; opacity: .25; transition: opacity .3s; }
    .controls:hover, .controls:focus-within { opacity: 1; }
    body.playing .controls { opacity: 0; pointer-events: none; }
    .hint { position: fixed; bottom: 12px; left: 16px; font-size: .75rem; color: rgba(255,255,255,.3); z-index: 30; }
    body.playing .hint { display: none; }
  </style>
</head>
<body>
  <section class="screen" id="idle">
    <div>
      <img class="logo" src="/logo.png" alt="Best of Eurovision Song Contest" width="800" height="464">
      <div class="eyebrow" id="event-title"></div>
      <h1 class="grad-text">Welcher Song wird der Winner-Song?</h1>
    </div>
    <div class="idle-row">
      <div>
        <div class="qr" id="qr"></div>
        <div class="url" id="url"></div>
      </div>
      <div>
        <div class="count" id="count">0</div>
        <div class="count-label" id="count-label">Stimmen</div>
        <div style="margin-top:3vh"><span class="pill" id="status">…</span></div>
      </div>
    </div>
  </section>

  <section class="screen" id="board" hidden>
    <div id="board-caption"></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="screen" id="intro" hidden><div id="intro-text"></div></section>

  <section class="screen" id="winner" hidden>
    <div class="beams" id="beams"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div></div>
    <div class="spot" id="spot"></div>
    <div class="winner-content">
      <div id="winner-pre"></div>
      <div id="winner-card" hidden></div>
    </div>
  </section>

  <canvas id="confetti"></canvas>

  <div class="controls">
    <button class="btn-small" id="sound-btn">🔇 Ton aktivieren</button>
    <button class="btn-small" id="fs-btn">⛶ Vollbild</button>
  </div>
  <div class="hint">F = Vollbild · R = Enthüllung wiederholen · B = Rangliste/Gewinner umschalten</div>

  <script src="/vendor/qrcode.js"></script>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PLAYED_KEY = 'mvu-esc-played';
    let state = null;
    let lastCount = null;
    let qrFor = '';
    let run = 0; // incremented to cancel a running reveal
    let revealShown = false;

    const sleep = (ms, token) => new Promise((resolve, reject) =>
      setTimeout(() => (token === run ? resolve() : reject(new Error('cancelled'))), ms));

    function show(id) {
      for (const s of ['idle', 'board', 'intro', 'winner']) $(s).hidden = s !== id;
    }

    // ------------------------------------------------------------ sound (Web Audio, no files)
    const sound = {
      ctx: null,
      enable() {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        this.ctx.resume();
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      },
      noiseHit(t, dur, gain, type, freq) {
        const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
        src.buffer = this.noise; f.type = type; f.frequency.value = freq;
        g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(f).connect(g).connect(c.destination);
        src.start(t, Math.random()); src.stop(t + dur + .05);
      },
      tone(t, freq, dur, gain, type = 'sine', endFreq) {
        const c = this.ctx, o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
        g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
      },
      ding() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.tone(t, 1318, .5, .18); this.tone(t + .07, 1760, .6, .12);
      },
      whoosh() {
        if (!this.ctx) return;
        this.noiseHit(this.ctx.currentTime, .6, .25, 'bandpass', 900);
      },
      drumroll(seconds) {
        if (!this.ctx) return;
        const t0 = this.ctx.currentTime;
        for (let t = 0; t < seconds; t += 0.045) {
          const k = t / seconds;
          this.noiseHit(t0 + t, .08, .05 + k * k * .35, 'bandpass', 1800 + (Math.random() * 400));
        }
      },
      crash() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        this.noiseHit(t, 3, .6, 'highpass', 5000);
        this.noiseHit(t, .4, .7, 'lowpass', 300);
        this.tone(t, 90, 1.2, .7, 'sine', 40);
        // little brass-ish fanfare
        [[523, 0], [659, .12], [784, .24], [1046, .4]].forEach(([f, d]) => {
          this.tone(t + .5 + d, f, d === .4 ? 1.6 : .3, .12, 'sawtooth');
          this.tone(t + .5 + d, f * 2, d === .4 ? 1.6 : .3, .04, 'square');
        });
      },
    };

    $('sound-btn').addEventListener('click', () => {
      sound.enable();
      $('sound-btn').textContent = '🔊 Ton aktiv';
      sound.ding();
    });
    $('fs-btn').addEventListener('click', toggleFullscreen);
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    // ------------------------------------------------------------ confetti
    const confetti = (() => {
      const canvas = $('confetti'), ctx = canvas.getContext('2d');
      const colors = ['#ff2e93', '#8a3cff', '#19d3ff', '#ffd35c', '#ffffff', '#3ee6a0'];
      let parts = [], raf = null, rainUntil = 0;
      function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
      addEventListener('resize', resize); resize();
      function spawn(x, y, vx, vy) {
        parts.push({ x, y, vx, vy, r: (6 + Math.random() * 8) * devicePixelRatio, a: Math.random() * 6.28,
          va: (Math.random() - .5) * .3, c: colors[Math.random() * colors.length | 0], s: Math.random() < .3 });
      }
      function burst() {
        const W = canvas.width, H = canvas.height, dpr = devicePixelRatio;
        for (let i = 0; i < 160; i++) {
          spawn(0, H * .85, (8 + Math.random() * 14) * dpr, -(14 + Math.random() * 16) * dpr);
          spawn(W, H * .85, -(8 + Math.random() * 14) * dpr, -(14 + Math.random() * 16) * dpr);
        }
        for (let i = 0; i < 120; i++) {
          const a = Math.random() * 6.28, v = (6 + Math.random() * 18) * dpr;
          spawn(W / 2, H * .45, Math.cos(a) * v, Math.sin(a) * v - 6 * dpr);
        }
      }
      function frame() {
        const W = canvas.width, H = canvas.height, dpr = devicePixelRatio;
        ctx.clearRect(0, 0, W, H);
        if (performance.now() < rainUntil) for (let i = 0; i < 3; i++) spawn(Math.random() * W, -20, (Math.random() - .5) * 2 * dpr, (2 + Math.random() * 3) * dpr);
        parts = parts.filter((p) => p.y < H + 40);
        for (const p of parts) {
          p.vy += .35 * dpr; p.vx *= .985; p.vy = Math.min(p.vy, 7 * dpr);
          p.x += p.vx + Math.sin(p.a) * dpr; p.y += p.vy; p.a += p.va;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
          if (p.s) { ctx.beginPath(); ctx.arc(0, 0, p.r / 2, 0, 6.28); ctx.fill(); }
          else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2 * Math.abs(Math.cos(p.a * 2)) + 1);
          ctx.restore();
        }
        raf = parts.length || performance.now() < rainUntil ? requestAnimationFrame(frame) : null;
        if (!raf) ctx.clearRect(0, 0, W, H);
      }
      return {
        fire(rainMs = 9000) { burst(); rainUntil = performance.now() + rainMs; if (!raf) raf = requestAnimationFrame(frame); },
        stop() { parts = []; rainUntil = 0; },
      };
    })();

    // ------------------------------------------------------------ idle screen
    function renderIdle() {
      $('event-title').textContent = state.title;
      const url = state.publicUrl || location.origin + '/';
      if (url !== qrFor && window.qrcode) {
        const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        $('qr').innerHTML = qr.createSvgTag(8, 0);
        qrFor = url;
      }
      $('url').textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
      const count = $('count');
      if (lastCount !== null && state.totalVotes !== lastCount) {
        count.classList.remove('bump'); void count.offsetWidth; count.classList.add('bump');
      }
      count.textContent = state.totalVotes;
      lastCount = state.totalVotes;
      $('count-label').textContent = state.totalVotes === 1 ? 'Stimme' : 'Stimmen';
      const status = $('status');
      status.className = 'pill ' + (state.votingOpen ? 'open' : 'closed');
      status.textContent = state.votingOpen ? 'Jetzt abstimmen!' : (state.totalVotes ? 'Voting geschlossen' : 'Voting noch nicht offen');
    }

    // ------------------------------------------------------------ reveal
    function ranked() {
      const order = new Map(state.songs.map((s, i) => [s.id, i]));
      const rows = [...state.results].sort((a, b) => b.votes - a.votes || order.get(a.id) - order.get(b.id));
      rows.forEach((r, i) => { r.rank = i > 0 && r.votes === rows[i - 1].votes ? rows[i - 1].rank : i + 1; });
      return rows;
    }

    function pct(v) { return state.totalVotes ? Math.round((v / state.totalVotes) * 100) : 0; }

    function buildBoard(rows) {
      const rowh = Math.min(window.innerHeight * 0.11, (window.innerHeight * 0.78) / rows.length);
      $('rows').style.setProperty('--rowh', rowh + 'px');
      $('rows').innerHTML = rows.map(() => `
        <div class="row hidden-song">
          <div class="rank">?</div>
          <div class="who"><div class="t">? ? ?</div><div class="a">&nbsp;</div></div>
          <div class="meter"><div class="fill"></div></div>
          <div class="score">–</div>
        </div>`).join('');
      return [...$('rows').children];
    }

    function countUp(el, target, ms) {
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        el.firstChild.nodeValue = String(Math.round(target * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function revealRow(el, r, max) {
      el.classList.remove('hidden-song', 'suspense');
      el.classList.add('flip');
      setTimeout(() => {
        el.classList.add('revealed');
        el.querySelector('.rank').textContent = r.rank + '.';
        el.querySelector('.t').textContent = r.title;
        el.querySelector('.a').textContent = songLine(r) || ' ';
        const score = el.querySelector('.score');
        score.innerHTML = `0<small>${pct(r.votes)}%</small>`;
        countUp(score, r.votes, 1000);
        el.querySelector('.fill').style.width = (max ? (r.votes / max) * 100 : 0) + '%';
      }, 360);
      sound.whoosh();
      setTimeout(() => sound.ding(), 380);
    }

    async function intro(text, ms, token) {
      show('intro');
      const el = $('intro-text');
      el.className = ''; void el.offsetWidth;
      el.textContent = text; el.className = 'grad-text fade-in';
      await sleep(ms, token);
    }

    function renderWinnerCard(rows, winners, animate) {
      const tie = winners.length > 1;
      const card = $('winner-card');
      card.innerHTML = `
        <div class="crown">${tie ? '🤝' : '👑'}</div>
        ${tie ? '<div class="winner-artist" style="animation:none">Gleichstand!</div>' : ''}
        ${winners.map((w) => `
          <div class="winner-title ${tie ? 'small' : ''}">${esc(w.title)}</div>
          <div class="winner-artist">${esc(songLine(w))}</div>`).join('')}
        <div class="winner-votes"><span class="pill revealed">${winners[0].votes} von ${state.totalVotes} Stimmen · ${pct(winners[0].votes)}%</span></div>
        <div class="zugabe grad-text">WINNER-SONG!</div>`;
      card.classList.toggle('static', !animate);
      card.hidden = false;
      $('winner-pre').textContent = '';
      $('beams').classList.add('on');
      $('spot').classList.add('on');
    }

    function showFinal(rows, winners) {
      const max = rows[0]?.votes || 0;
      const els = buildBoard(rows);
      els.forEach((el, i) => {
        const r = rows[i];
        el.className = 'row revealed' + (r.votes === max && max > 0 ? ' champion' : '');
        el.querySelector('.rank').textContent = r.rank + '.';
        el.querySelector('.t').textContent = r.title;
        el.querySelector('.a').textContent = songLine(r) || ' ';
        el.querySelector('.score').innerHTML = `${r.votes}<small>${pct(r.votes)}%</small>`;
        el.querySelector('.fill').style.transition = 'none';
        el.querySelector('.fill').style.width = (max ? (r.votes / max) * 100 : 0) + '%';
      });
      $('board-caption').innerHTML = '<span class="grad-text">Die Rangliste</span>';
      if (winners.length) renderWinnerCard(rows, winners, false);
      show(winners.length ? 'winner' : 'board');
    }

    async function playReveal() {
      const token = ++run;
      revealShown = true;
      confetti.stop();
      document.body.classList.add('playing');
      const rows = ranked();
      const max = rows[0]?.votes || 0;
      const winners = max > 0 ? rows.filter((r) => r.votes === max) : [];
      $('winner-card').hidden = true;
      $('beams').classList.remove('on');
      $('spot').classList.remove('on');

      try {
        if (!winners.length) {
          await intro('Noch keine Stimmen… 🤷', 1000, token);
          return;
        }
        await intro('Die Stimmen sind ausgezählt…', 3000, token);
        await intro('Und der Winner-Song ist…', 2200, token);

        const els = buildBoard(rows);
        $('board-caption').innerHTML = '<span class="grad-text">Die Rangliste</span>';
        show('board');
        await sleep(1400, token);

        const others = rows.length - winners.length; // rows revealed one by one, from the bottom
        const step = Math.max(900, Math.min(2000, 12000 / Math.max(1, others)));
        for (let i = rows.length - 1; i >= winners.length; i--) {
          const isRunnerUp = i === winners.length;
          if (isRunnerUp) {
            const remaining = els.slice(0, winners.length + 1);
            $('board-caption').innerHTML = `<span class="grad-text">${remaining.length === 2 ? 'Nur noch zwei Songs im Rennen…' : 'Wer wird der Winner-Song?'}</span>`;
            remaining.forEach((el) => el.classList.add('suspense'));
            sound.drumroll(3.2);
            await sleep(3300, token);
            remaining.forEach((el) => el.classList.remove('suspense'));
          } else {
            $('board-caption').innerHTML = `Platz <span class="grad-text">${rows[i].rank}</span>`;
          }
          revealRow(els[i], rows[i], max);
          await sleep(isRunnerUp ? 2400 : step, token);
        }

        // Winner: blackout, drumroll, then slam.
        show('winner');
        $('winner-card').hidden = true;
        const pre = $('winner-pre');
        pre.className = ''; void pre.offsetWidth;
        pre.textContent = winners.length > 1 ? 'Wir haben einen Gleichstand…' : 'Der Winner-Song ist…';
        pre.className = 'grad-text fade-in';
        $('spot').classList.add('on');
        sound.drumroll(3.6);
        await sleep(3700, token);

        document.body.insertAdjacentHTML('beforeend', '<div class="flash"></div>');
        setTimeout(() => document.querySelector('.flash')?.remove(), 900);
        sound.crash();
        renderWinnerCard(rows, winners, true);
        const content = document.querySelector('.winner-content');
        content.classList.remove('shake'); void content.offsetWidth; content.classList.add('shake');
        confetti.fire();
        try { sessionStorage.setItem(PLAYED_KEY, String(state.revealId)); } catch {}
      } catch (err) {
        if (err.message !== 'cancelled') throw err;
      } finally {
        if (token === run) document.body.classList.remove('playing');
      }
    }

    // ------------------------------------------------------------ main loop
    function played() { try { return sessionStorage.getItem(PLAYED_KEY); } catch { return null; } }

    async function refresh() {
      try { state = await api('/api/state'); } catch { return; }
      if (!state.revealed) {
        if (revealShown) { run++; revealShown = false; confetti.stop(); document.body.classList.remove('playing'); }
        renderIdle();
        show('idle');
        return;
      }
      if (revealShown) return;
      if (played() === String(state.revealId)) {
        revealShown = true;
        const rows = ranked();
        const max = rows[0]?.votes || 0;
        showFinal(rows, max > 0 ? rows.filter((r) => r.votes === max) : []);
      } else {
        playReveal();
      }
    }

    addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea')) return;
      const k = e.key.toLowerCase();
      if (k === 'f') toggleFullscreen();
      if (k === 'r' && state?.revealed) playReveal();
      if (k === 'b' && state?.revealed && !document.body.classList.contains('playing')) {
        if (!$('winner').hidden) {
          const rows = ranked();
          const max = rows[0]?.votes || 0;
          showFinal(rows, max > 0 ? rows.filter((r) => r.votes === max) : []);
          show('board');
        } else if (!$('winner-card').hidden) show('winner');
      }
    });

    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
